const sel = document.getElementById("lang");
for (const code in NAMES) {
  const o = document.createElement("option");
  o.value = code; o.textContent = NAMES[code];
  sel.appendChild(o);
}

function apply(code){
  const d = T[code] || T.en;
  document.documentElement.lang = code;
  document.title = d.title;
  document.querySelectorAll("[data-t]").forEach(el => {
    const v = d[el.dataset.t];
    // Strings carry only our own markup (<b>, <i>), never user input.
    if (v !== undefined) el.innerHTML = v;
  });
  sel.value = code;
}

// One platform at a time, preselected to the machine the visitor is on. The
// other is one click away rather than hidden -- people do download for a
// different computer -- and the choice is remembered so they do not have to
// make it again on the next visit.
function selectOS(os){
  document.querySelectorAll(".tab").forEach(tab => {
    tab.setAttribute("aria-selected", String(tab.dataset.os === os));
  });
  document.querySelectorAll(".pane").forEach(pane => {
    pane.hidden = pane.dataset.os !== os;
  });
  try { localStorage.setItem("hdpi_os", os); } catch (e) { /* private mode */ }
}

function defaultOS(){
  try {
    const saved = localStorage.getItem("hdpi_os");
    if (saved === "win" || saved === "mac") return saved;
  } catch (e) { /* private mode */ }
  const ua = navigator.userAgent;
  return (/Mac|iPhone|iPad/.test(ua) && !/Windows/.test(ua)) ? "mac" : "win";
}

function pick(){
  const saved = localStorage.getItem("hdpi_lang");
  if (saved && T[saved]) return saved;
  for (const l of (navigator.languages || [navigator.language || "en"])) {
    const base = String(l).toLowerCase().split("-")[0];
    if (T[base]) return base;
  }
  return "en";
}

sel.addEventListener("change", () => {
  localStorage.setItem("hdpi_lang", sel.value);
  apply(sel.value);
});

document.querySelectorAll(".tab").forEach(tab => {
  tab.addEventListener("click", () => selectOS(tab.dataset.os));
});

apply(pick());
selectOS(defaultOS());
</script>
