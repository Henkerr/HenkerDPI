const sel = document.getElementById("lang");
for (const code in NAMES) {
  const o = document.createElement("option");
  o.value = code; o.textContent = NAMES[code];
  sel.appendChild(o);
}

function apply(code){
  const d = T[code] || T.en;
  document.documentElement.lang = code;
  document.title = d.title;
  document.querySelectorAll("[data-t]").forEach(el => {
    const v = d[el.dataset.t];
    // Strings carry only our own markup (<b>, <i>), never user input.
    if (v !== undefined) el.innerHTML = v;
  });
  sel.value = code;
}

function pick(){
  const saved = localStorage.getItem("hdpi_lang");
  if (saved && T[saved]) return saved;
  for (const l of (navigator.languages || [navigator.language || "en"])) {
    const base = String(l).toLowerCase().split("-")[0];
    if (T[base]) return base;
  }
  return "en";
}

sel.addEventListener("change", () => {
  localStorage.setItem("hdpi_lang", sel.value);
  apply(sel.value);
});

apply(pick());
