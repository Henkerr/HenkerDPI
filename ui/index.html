<!doctype html>
<html lang="tr"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HenkerDPI</title>
<style>html,body{height:100%;margin:0;background:#0a0b0d}</style>
</head><body>
<!-- Bootstrap: opens the theme saved in the engine, then hands off to its page. -->
<script src="bridge.js"></script>
<script>
HDPI.whenReady(function () {
  HDPI.getState()
    .then(function (s) { location.replace(((s && s.theme) || "mevcut") + ".html"); })
    .catch(function () { location.replace("mevcut.html"); });
});
</script>
</body></html>
