.con-ov{position:fixed;inset:0;z-index:60;background:rgba(2,6,5,.62);display:none;place-items:center;padding:12px}
.con-ov.open{display:grid}

</head><body>
<figure><div class="win" id="win">

        <div class="filters" id="conFilters"><span class="fon" data-f="all">Hepsi</span><span data-f="bypass">Bypass</span><span data-f="block">Engel</span><input id="conSearch" type="text" placeholder="alan adı ara…" spellcheck="false" autocomplete="off"><span class="srch" id="conSrch"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20.5 20.5l-4-4"/></svg></span></div></div>

div class="ln"><span class="t">14:02:28</span><span class="ok">bypass</span> media.discordapp.net<span class="mk">✓</span></div><div class="ln"><span class="t">14:02:28</span><span class="rf">refuse</span> quic → tcp<span class="mk">↺</span></div><div class="ln"><span class="t">14:02:27</span><span class="ok">bypass</span> youtube.com<span class="mk">✓</span></div><div class="ln"><span class="t">14:02:27</span><span class="ok">bypass</span> twimg.com<span class="mk">✓</span></div></div></div>
      <div class="foot"><span><b id="conFBypass">1284</b> bypass</span><span><b id="conFSure">12:30</b> süre</span><span>dns <b id="conFDns">1.1.1.1</b></span><span>mod <b id="conFMod">TÜMÜ</b></span></div>

<div class="con-ov" id="conSettings"><figure><div class="win">
      <div class="hd"><span class="back" id="conBack">‹ AYARLAR</span><button class="gear on">⚙</button></div>
      <div class="rows">
        <div class="row"><div class="rl"><b>Güvenli DNS</b><small>ISP DNS engelini aşar</small></div><div class="rr"><span class="menu" id="conSetDns">Cloudflare ▾</span><span class="sw on" id="conSwDns"></span></div></div>
        <div class="row"><div class="rl"><b>Mod</b><small>hangi siteler aşılsın</small></div><div class="rr"><div class="seg2" id="conSetSeg"><span class="on">Tümü</span><span>Seçili</span></div></div></div>
        <div class="row"><div class="rl"><b>Açılışta başlat</b><small>Windows ile birlikte</small></div><div class="rr"><span class="sw on" id="conSwAuto"></span></div></div>
        <div class="row"><div class="rl"><b>RST koruması</b><small>ISP reset paketlerini düşür</small></div><div class="rr"><span class="sw" id="conSwRst"></span></div></div>
        <div class="row"><div class="rl"><b>Tema</b></div><div class="rr"><span class="dots" id="conThemeDots"><i data-k="mevcut" style="background:#4d8bff"></i><i data-k="console" class="sel" style="background:#2DD4BF"></i><i data-k="bento" style="background:#38bdf8"></i><i data-k="arcade" style="background:#ff3d9a"></i><i data-k="combat" style="background:#16a34a"></i></span></div></div>
        <div class="row"><div class="rl"><b>Özel alan adları</b><small>3 alan ekli</small></div><div class="rr"><span class="add">+ Ekle</span></div></div>

      </div>
      <div class="setfoot"><span>Güvenli DNS · Kernel filtre · WinDivert</span><span>v<b>2.7</b></span></div>
      <div class="gin"></div></div>

<script src="bridge.js"></script>
<script>

const $=id=>document.getElementById(id), p2=n=>String(n).padStart(2,'0'), fmt=n=>Number(n).toLocaleString('tr-TR');
const up=s=>p2(Math.floor(s/60))+":"+p2(s%60);
function setTxt(el,t){for(const n of el.childNodes){if(n.nodeType===3&&n.nodeValue.trim()){n.nodeValue=t;return;}}el.appendChild(document.createTextNode(t));}
function syncSeg(el,allOn){ el.querySelectorAll("span").forEach(sp=>sp.classList.toggle("on",(sp.textContent.trim()==="Tümü")===allOn)); }
function render(s){
  const on=s.running;
  $("win").classList.toggle("off",!on);
  $("conStatus").textContent = on?"KORUMA AKTİF":"KORUMA KAPALI";
  $("conSub").textContent = (on?"DPI bypass çalışıyor · ":"Durduruldu · ")+up(s.uptime);
  setTxt($("conStop"), on?"DURDUR":"BAŞLAT");
  $("conFBypass").textContent = on?fmt(s.bypassed):"0";
  $("conFSure").textContent = on?up(s.uptime):"00:00";
  $("conFDns").textContent = s.dns_ip||"1.1.1.1";
  $("conFMod").textContent = s.mode==="all"?"TÜMÜ":"SEÇİLİ";
  syncSeg($("conSeg"), s.mode==="all");
  syncSeg($("conSetSeg"), s.mode==="all");
  $("conSetDns").textContent = (s.dns_name||"Cloudflare")+" ▾";
  $("conSwDns").classList.toggle("on", !!s.dns_enabled);
  $("conSwAuto").classList.toggle("on", !!s.autostart);
  $("conThemeDots").querySelectorAll("i").forEach(i=>i.classList.toggle("sel", i.dataset.k===s.theme));
}
const P=HDPI.poll(render);
$("conStop").addEventListener("click", async()=>{ await HDPI.toggle(); P.tick(); });
function cycleMode(e){ const sp=e.target.closest("span"); if(!sp)return; HDPI.setMode(sp.textContent.trim()==="Tümü"?"all":"selective").then(P.tick); }
$("conSeg").addEventListener("click", cycleMode);
$("conSetSeg").addEventListener("click", cycleMode);
$("conSetDns").addEventListener("click", async()=>{ const D=HDPI.DNS, s=await HDPI.getState(); const i=D.findIndex(d=>d[1]===s.dns_name); await HDPI.setDns(D[(i+1)%D.length][0]); P.tick(); });
$("conSwDns").addEventListener("click", async()=>{ const s=await HDPI.getState(); await HDPI.setDnsEnabled(!s.dns_enabled); P.tick(); });
$("conSwAuto").addEventListener("click", async()=>{ const s=await HDPI.getState(); await HDPI.setAutostart(!s.autostart); P.tick(); });
$("conSwRst").addEventListener("click", e=>e.currentTarget.classList.toggle("on"));
$("conThemeDots").addEventListener("click", e=>{ const i=e.target.closest("i"); if(i&&i.dataset.k) HDPI.nav(i.dataset.k); });
$("conGear").addEventListener("click", ()=>$("conSettings").classList.add("open"));
$("conBack").addEventListener("click", ()=>$("conSettings").classList.remove("open"));
$("conSettings").addEventListener("click", e=>{ if(e.target.id==="conSettings") e.target.classList.remove("open"); });

// ---- live log: REAL events from the engine (SNI bypass/pass + QUIC engel) ----
function esc(x){ return String(x).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
var _logFilter="all";                // all | bypass | block(engel)
var _logSearch="";                   // host substring filter (search box)
var _prevLog=null;                   // the list rendered on the previous tick
function _logKey(e){ return e.t+"|"+e.host+"|"+e.act; }
// How many fresh entries lead the new list vs the previous one. Both are
// newest-first, so new events sit at the front and the old head slides down;
// we find where the previous head re-appears (a 5-deep match to survive
// duplicate lines). Fully churned -> cap the slide.
function _newLead(a,b){
  if(!b||!b.length) return 0;
  var W=Math.min(5,b.length);
  for(var k=0;k+W<=a.length;k++){
    var hit=true;
    for(var j=0;j<W;j++){ if(_logKey(a[k+j])!==_logKey(b[j])){ hit=false; break; } }
    if(hit) return k;
  }
  return Math.min(a.length,12);
}
function renderLog(list){
  const el=$("conLog"); if(!el) return;
  const box=el.parentElement;        // .log — fixed height, clips overflow
  if(!list||!list.length){ el.style.transition="none"; el.style.transform="translateY(0)"; el.innerHTML='<div class="ln" style="opacity:.45">'+((_logFilter!=="all"||_logSearch)?"· eşleşme yok ·":"· trafik bekleniyor ·")+'</div>'; _prevLog=null; return; }
  const lead=_newLead(list,_prevLog);
  el.innerHTML = list.map(function(e){
    var blk = e.act==="block"||e.act==="refuse";   // QUIC refused → forced to TCP
    var cls = e.act==="bypass"?"ok":(blk?"rf":"");
    var mk  = e.act==="bypass"?"✓":(blk?"↺":"·");
    var lab = e.act==="bypass"?"bypass":(blk?"engel":"pass");
    var host = blk ? "quic → "+esc(e.host) : esc(e.host);
    return '<div class="ln"><span class="t">'+e.t+'</span><span class="'+cls+'">'+lab+'</span> '+host+'<span class="mk">'+mk+'</span></div>';
  }).join("");
  // Downward flow: fresh lines land at the TOP and push the list down. Animate
  // that push only once the log overflows the box (enough lines to scroll) AND
  // real new lines arrived — start the stream shifted up by their height, then
  // glide back to rest so the feed visibly flows downward. This keeps flowing
  // even after the buffer fills (height stops growing but new lines still land).
  const over=el.scrollHeight-box.clientHeight;
  const lineH=el.firstElementChild ? el.firstElementChild.offsetHeight : 22;
  const add=Math.min(lead*lineH, box.clientHeight);
  if(over>0 && add>0 && _prevLog){
    el.style.transition="none"; el.style.transform="translateY(-"+add+"px)";
    void el.offsetHeight;            // commit the start state before animating
    requestAnimationFrame(function(){ el.style.transition="transform .5s ease-out"; el.style.transform="translateY(0)"; });
  }else{
    el.style.transition="none"; el.style.transform="translateY(0)";
  }
  _prevLog=list;
}
function applyLogFilter(list){
  var q=_logSearch.trim().toLowerCase();
  return (list||[]).filter(function(e){
    if(q) return String(e.host).toLowerCase().indexOf(q)>=0;   // search overrides the chip
    if(_logFilter==="bypass") return e.act==="bypass";
    if(_logFilter==="block")  return e.act==="block"||e.act==="refuse";
    return true;                                                // "all"
  }).slice(0,40);
}
async function tickLog(){ if(document.hidden) return; try{ renderLog(applyLogFilter(await HDPI.getLog(60))); }catch(e){} }
HDPI.whenReady(tickLog); setInterval(tickLog, 1000);
document.addEventListener("visibilitychange", function(){ if(!document.hidden) tickLog(); });

// filter chips (Hepsi / Bypass / Engel) + search box — re-render at once so the
// switch feels instant; _prevLog=null snaps (no flow slide) on the switch.
$("conFilters").addEventListener("click", function(ev){
  var sp=ev.target.closest("span[data-f]"); if(!sp) return;
  _logFilter=sp.dataset.f;
  $("conFilters").querySelectorAll("span[data-f]").forEach(function(x){ x.classList.toggle("fon", x===sp); });
  _prevLog=null; tickLog();
});
$("conSrch").addEventListener("click", function(){
  var on=$("conFilters").classList.toggle("searching");
  if(on){ $("conSearch").focus(); }
  else { $("conSearch").value=""; _logSearch=""; _prevLog=null; tickLog(); }
});
$("conSearch").addEventListener("input", function(){ _logSearch=this.value; _prevLog=null; tickLog(); });
$("conSearch").addEventListener("keydown", function(ev){ if(ev.key==="Escape") $("conSrch").click(); });

</script>
</body></html>
